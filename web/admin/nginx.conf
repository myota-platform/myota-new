# The console's web server.
#
# It serves one static tree and does nothing else. No proxy, no rewrite to /v1: the API is
# on the same origin and Traefik routes /v1 to the gateway before a request ever reaches
# this container. A proxy here would be a second, invisible path to the API that the
# NetworkPolicy and the audience check were not written for.
#
# The fallback is the SPA: a client route like /admins is not a file, and nginx answering
# 404 for it would break every deep link and every reload.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No access log: Traefik already logs the request, and a second copy in the pod is
    # disk this cluster does not have. Errors still go to stderr, where the log stack
    # finds them.
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # A console is a few hundred kilobytes; compressing it is cheap and worth it on a
    # phone over a mobile connection in a field.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The headers that cost nothing and close a class of bug.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # `connect-src 'self'` is what makes "this console talks to nobody else" a policy
        # rather than a convention. `style-src` allows inline because the templates use
        # style attributes from the design system; script stays strict.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # Vite fingerprints these names, so they can be cached for a year.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html is never cached: a cached shell pointing at dead asset hashes is the
        # classic "hard refresh fixes it" bug.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
