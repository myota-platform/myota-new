# The geodata service contract: the spatial catalogue and the import pipeline.
#
# Owned database: `myota_geo`. The only database with PostGIS. `programme_id` and
# `actor_id` are opaque uuids with no foreign key — `core` owns those rows, and
# referential integrity across the boundary is a property of the event stream.
#
# Uploads never pass through this API. The API issues a presigned URL and the
# bytes go straight to object storage; a 1 GiB shapefile is a real case and it is
# not a request any replica should buffer.

openapi: 3.1.0

info:
  title: Myota geodata service
  version: 1.0.0
  summary: Entities, spatial review, provenance and the import pipeline.
  description: |
    The spatial catalogue. An `entity` is a place a programme recognises — a
    park, a summit, a region — with geometry, a lifecycle and a provenance trail
    back to the exact bytes an import read.

    Imports are staged, reviewed and promoted, never written straight to the
    catalogue. A run moves through `upload → normalise → validate → conflate`,
    pauses at `review` for a human decision, and only then publishes. The paused
    state is a `status`, not a sixth stage: "awaiting an administrator" is not
    something the pipeline does.

    Edits to a published entity are direct and carried on the `revision` the
    client read. A stale revision is a `409`, never a silent overwrite, because
    two reviewers editing one park is a normal day.

servers:
  - url: http://geodata-api.{namespace}.svc.cluster.local:8080
    description: >-
      In-cluster address. Reached through the gateway, or by `activity` for
      geometry it does not store.
    variables:
      namespace:
        default: myota-test
        enum: [myota, myota-test]

tags:
  - name: entities
    description: >-
      The catalogue. Public reads are anonymous; writes need `geodata.edit`.
  - name: proposals
    description: >-
      Participant-submitted corrections and new places. A proposal is a request
      for review, not an edit — participants cannot write the catalogue.
  - name: imports
    description: >-
      Resumable uploads, import runs, candidates, conflation and promotion.
      Administrator only.
  - name: sources
    description: >-
      Data providers, their snapshots and their schedules. Administrator only.
  - name: tiles
    description: Vector tiles for the public map. Anonymous.
  - name: geodata-internal
    description: Not published. Contract composition and the event feed.

paths:
  # ───────────────────────────────────────────────────────────────────────────
  # Entities — the catalogue. Reads are anonymous where the entity is published;
  # every write needs an administrator session.
  # ───────────────────────────────────────────────────────────────────────────

  /v1/entities:
    get:
      operationId: geodata.entities.list
      summary: List entities
      description: |
        Anonymous for published entities; an administrator may filter by every
        status. Filters combine, and the result is cursor-paginated in catalogue
        order so a map viewport request is cheap.

        `bbox` is `minLon,minLat,maxLon,maxLat` in WGS 84 — the same order as a
        GeoJSON bounding box, so a client does not have to remember a second
        convention.
      tags: [entities]
      security: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: programme
          in: query
          required: false
          description: Programme slug.
          schema:
            type: string
            examples: ['pota']
        - name: category
          in: query
          required: false
          description: Category code, as declared by the programme in `core`.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >-
            Only `published` is visible without an administrator session; any
            other value is refused rather than silently downgraded.
          schema:
            type: string
            enum: [draft, in_review, published, retired]
            default: published
        - name: bbox
          in: query
          required: false
          description: Bounding box filter, `minLon,minLat,maxLon,maxLat`.
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
          example: '-8.9,41.1,-8.5,41.4'
        - name: q
          in: query
          required: false
          description: Free text over name and slug.
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: One page of entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'
              example:
                items:
                  - id: 8f3c1e00-0000-4000-8000-000000000001
                    programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                    entityTypeCode: park
                    name: Parque Nacional da Peneda-Gerês
                    slug: parque-nacional-da-peneda-geres
                    status: published
                    centroid:
                      type: Point
                      coordinates: [-8.2167, 41.7333]
                    revision: 9
                    updatedAt: '2026-11-20T14:31:00Z'
                nextCursor: null
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'

    post:
      operationId: geodata.entities.create
      summary: Create an entity directly
      description: >-
        For a place an administrator adds by hand, not for bulk loads — bulk work
        goes through the import pipeline so it arrives with candidates, evidence
        and a review. Created as `draft`; publication is a separate act.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
            example:
              programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
              entityTypeCode: park
              name: Parque Natural de Somiedo
              geometry:
                type: Polygon
                coordinates: [[[-6.25, 43.0], [-6.05, 43.0], [-6.05, 43.15], [-6.25, 43.15], [-6.25, 43.0]]]
              categories: [park]
      responses:
        '201':
          description: The draft entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetail'
              example:
                id: 2b6f8d14-9c3a-4e07-b5d1-8a4c2f6e9b31
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                entityTypeCode: park
                name: Parque Natural de Somiedo
                slug: parque-natural-de-somiedo
                status: draft
                centroid:
                  type: Point
                  coordinates: [-6.15, 43.075]
                geometry:
                  type: Polygon
                  coordinates: [[[-6.25, 43.0], [-6.05, 43.0], [-6.05, 43.15], [-6.25, 43.15], [-6.25, 43.0]]]
                elevationMetres: null
                revision: 1
                categories:
                  - code: park
                    primary: true
                publishedAt: null
                updatedAt: '2026-11-27T13:00:00Z'
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  /v1/entities/{entityId}:
    get:
      operationId: geodata.entities.read
      summary: Read one entity
      description: >-
        Includes the full geometry. List responses carry only the centroid, so a
        map request for 200 parks is not 200 polygons, and a detail request is
        where the shape is actually needed.
      tags: [entities]
      security: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetail'
              example:
                id: 8f3c1e00-0000-4000-8000-000000000001
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                entityTypeCode: park
                name: Parque Nacional da Peneda-Gerês
                slug: parque-nacional-da-peneda-geres
                status: published
                centroid:
                  type: Point
                  coordinates: [-8.2167, 41.7333]
                geometry:
                  type: Polygon
                  coordinates: [[[-8.45, 41.6], [-8.0, 41.6], [-8.0, 41.9], [-8.45, 41.9], [-8.45, 41.6]]]
                elevationMetres: null
                revision: 9
                categories:
                  - code: park
                    primary: true
                publishedAt: '2026-11-20T14:31:00Z'
                updatedAt: '2026-11-20T14:31:00Z'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

    patch:
      operationId: geodata.entities.update
      summary: Edit an entity
      description: |
        Carries the `revision` the client read. The server compares it, applies
        the change and returns the new revision; a mismatch is
        `409 about:blank#revision-conflict` with both numbers in the detail, so a
        reviewer knows to re-read rather than to retry blindly.

        Editing does not use a staging table. A staging table was one of three
        overlapping mechanisms in the legacy system, and a single entity with a
        revision needs none of them.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
            example:
              revision: 9
              name: Parque Nacional Peneda-Gerês
              categories: [park, biosphere_reserve]
      responses:
        '200':
          description: The updated entity, with its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetail'
              example:
                id: 8f3c1e00-0000-4000-8000-000000000001
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                entityTypeCode: park
                name: Parque Nacional Peneda-Gerês
                slug: parque-nacional-da-peneda-geres
                status: published
                centroid:
                  type: Point
                  coordinates: [-8.2167, 41.7333]
                geometry:
                  type: Polygon
                  coordinates: [[[-8.45, 41.6], [-8.0, 41.6], [-8.0, 41.9], [-8.45, 41.9], [-8.45, 41.6]]]
                elevationMetres: null
                revision: 10
                categories:
                  - code: park
                    primary: true
                  - code: biosphere_reserve
                    primary: false
                publishedAt: '2026-11-20T14:31:00Z'
                updatedAt: '2026-11-27T13:05:00Z'
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  /v1/entities/{entityId}/history:
    get:
      operationId: geodata.entities.readHistory
      summary: Read an entity's audit trail
      description: >-
        Every change with actor, action, before and after. Actor ids are `core`
        account ids held as opaque values — no foreign key, because the account
        may be closed while the history must survive it.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of audit events, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              example:
                items:
                  - id: 3a7c9f21-6b4d-4e08-9c1a-5d2e7b0f4a83
                    action: entity.published
                    actorId: 0f7d2b19-4c6e-4a83-b5d2-9e1c7a3f6b48
                    occurredAt: '2026-11-20T14:31:00Z'
                    before:
                      status: in_review
                    after:
                      status: published
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/entities/{entityId}/provenance:
    get:
      operationId: geodata.entities.readProvenance
      summary: Read where an entity's data came from
      description: >-
        One row per source that contributed: the snapshot (the exact bytes an
        import read), the source's own feature id, and a confidence. This is what
        makes an attribution claim answerable a year later.
      tags: [entities]
      security: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of provenance rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenancePage'
              example:
                items:
                  - sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                    sourceName: Protected Planet
                    snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                    sourceFeatureId: WDPA-555
                    confidence: 0.98
                    retrievedAt: '2026-11-18T03:00:00Z'
                nextCursor: null
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/entities/{entityId}/publish:
    post:
      operationId: geodata.entities.publish
      summary: Publish an entity
      description: >-
        Makes the entity visible to participants and publishes
        `geodata.entity.published.v1`, which is how `activity` learns that the
        place can be activated.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: Publishing a published entity is a no-op that republishes no event.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The published entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySummary'
              example:
                id: 2b6f8d14-9c3a-4e07-b5d1-8a4c2f6e9b31
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                entityTypeCode: park
                name: Parque Natural de Somiedo
                slug: parque-natural-de-somiedo
                status: published
                centroid:
                  type: Point
                  coordinates: [-6.15, 43.075]
                revision: 2
                updatedAt: '2026-11-27T13:10:00Z'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  /v1/entities/{entityId}/retire:
    post:
      operationId: geodata.entities.retire
      summary: Retire an entity
      description: >-
        Hides the entity from the public catalogue and publishes
        `geodata.entity.retired.v1`. Activations that used it keep it: `activity`
        captured the name and elevation at activation start, so retiring a place
        does not rewrite anyone's log.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: Retiring a retired entity is a no-op that republishes no event.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../shared/components.yaml#/components/schemas/Rejection'
            example:
              reason: Merged into the adjacent entity after a boundary correction.
      responses:
        '200':
          description: The retired entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySummary'
              example:
                id: 8f3c1e00-0000-4000-8000-000000000001
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                entityTypeCode: park
                name: Parque Nacional da Peneda-Gerês
                slug: parque-nacional-da-peneda-geres
                status: retired
                centroid:
                  type: Point
                  coordinates: [-8.2167, 41.7333]
                revision: 11
                updatedAt: '2026-11-27T13:15:00Z'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  /v1/entities/{entityId}/attachments:
    post:
      operationId: geodata.entities.createAttachment
      summary: Attach an image to an entity
      description: >-
        Returns a presigned `PUT` URL. The client uploads the bytes to object
        storage, then calls this endpoint again with the completed attachment to
        confirm. The second step exists because a presigned URL proves intent,
        not that the object arrived.
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreate'
            example:
              kind: photo
              mediaType: image/jpeg
              sizeBytes: 184320
              checksumSha256: 6b3a1c9e8f2d4b7a0c5e9d1f3a8b6c2e4d7f0a9b1c3e5d8f2a4b6c0e7d9f1a35
      responses:
        '201':
          description: The attachment record and where to put the bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
              example:
                id: 9c4e7a12-3b8d-4f60-a1c5-7e2b9d4f6a08
                kind: photo
                mediaType: image/jpeg
                sizeBytes: 184320
                checksumSha256: 6b3a1c9e8f2d4b7a0c5e9d1f3a8b6c2e4d7f0a9b1c3e5d8f2a4b6c0e7d9f1a35
                uploadUrl: https://silo-api.spainip.es/myota-test-content/entities/8f3c1e00-0000-4000-8000-000000000001/9c4e7a12-3b8d-4f60-a1c5-7e2b9d4f6a08?X-Amz-Signature=…
                uploadExpiresAt: '2026-11-27T13:20:00Z'
                confirmedAt: null
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '413':
          description: The declared size exceeds the attachment ceiling.
          content:
            application/problem+json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Problem'
              example:
                type: about:blank#upload-too-large
                title: Attachment too large
                status: 413
                detail: 12 MiB declared; the attachment ceiling is 8 MiB.
                requestId: 7c1f9e0a-3f2f-4d6e-9b71-1a2b3c4d5e6f

  /v1/entities/{entityId}/attachments/{attachmentId}:
    delete:
      operationId: geodata.entities.deleteAttachment
      summary: Remove an attachment
      tags: [entities]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  # ───────────────────────────────────────────────────────────────────────────
  # Proposals — participant submissions
  # ───────────────────────────────────────────────────────────────────────────

  /v1/proposals:
    get:
      operationId: geodata.proposals.listMine
      summary: List the participant's proposals
      description: >-
        A participant sees only their own proposals. The administrator view of
        the same rows is `/v1/admin/proposals`; one resource, two audiences, one
        table.
      tags: [proposals]
      security:
        - participantBearer: []
        - participantSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, approved, rejected, withdrawn]
      responses:
        '200':
          description: One page of proposals, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalPage'
              example:
                items:
                  - id: 5e2a8c41-7f3b-4d09-a6e2-1c8b5d3f9a07
                    kind: correction
                    entityId: 8f3c1e00-0000-4000-8000-000000000001
                    entityName: Parque Nacional Peneda-Gerês
                    status: open
                    createdAt: '2026-11-25T16:40:00Z'
                    decidedAt: null
                    decisionNote: null
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
    post:
      operationId: geodata.proposals.create
      summary: Propose a new place or a correction
      description: >-
        Participants cannot write the catalogue. A proposal is a request for
        review that carries the evidence, and an administrator decides it. This
        is the only write path a participant has into `geodata`.
      tags: [proposals]
      security:
        - participantBearer: []
        - participantSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalCreate'
            example:
              kind: correction
              entityId: 8f3c1e00-0000-4000-8000-000000000001
              programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
              note: The northern boundary ends at the river, not the track.
              geometry:
                type: Polygon
                coordinates: [[[-8.45, 41.6], [-8.0, 41.6], [-8.0, 41.88], [-8.45, 41.88], [-8.45, 41.6]]]
      responses:
        '201':
          description: The proposal, awaiting review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              example:
                id: 5e2a8c41-7f3b-4d09-a6e2-1c8b5d3f9a07
                kind: correction
                entityId: 8f3c1e00-0000-4000-8000-000000000001
                entityName: Parque Nacional Peneda-Gerês
                status: open
                createdAt: '2026-11-27T13:25:00Z'
