  # ───────────────────────────────────────────────────────────────────────────
  # Imports — upload
  # ───────────────────────────────────────────────────────────────────────────

  /v1/imports/uploads:
    post:
      operationId: geodata.imports.createUpload
      summary: Open a resumable upload session
      description: |
        A 1 GiB shapefile over a poor connection is a real case, so uploads are
        multipart and resumable. The session records the declared size and
        checksum up front: a client that cannot state them is not uploading a
        file it knows anything about, and a mismatch at completion is caught
        before an import ever reads the bytes.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionCreate'
            example:
              sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
              filename: protected-planet-es.geojson
              sizeBytes: 1048576
              checksumSha256: 9f2c6b1e4a8d3c7f0b5e9a2d6c4f8b1e3a7c0d5f9b2e6a4c8d1f7b3e0a9c6d52
              format: geojson
      responses:
        '201':
          description: The session, with the first part's upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
              example:
                id: 4d7b2e91-8c6a-4f35-b0d9-2e5a8c1f7b64
                objectKey: imports/4d7b2e91-8c6a-4f35-b0d9-2e5a8c1f7b64/source
                sizeBytes: 1048576
                state: open
                partSizeBytes: 8388608
                expiresAt: '2026-11-28T13:40:00Z'
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '413':
          description: The declared size exceeds the import ceiling.
          content:
            application/problem+json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Problem'
              example:
                type: about:blank#upload-too-large
                title: Upload exceeds the ceiling
                status: 413
                detail: 2 GiB declared; the ceiling is 1 GiB.
                requestId: 7c1f9e0a-3f2f-4d6e-9b71-1a2b3c4d5e6f

  /v1/imports/uploads/{sessionId}/parts:
    post:
      operationId: geodata.imports.signPart
      summary: Sign one part of an upload
      description: >-
        Returns a presigned URL for a single part. Called per part, so a
        connection that drops at part 7 resumes at part 7.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: Signing a URL twice issues a second valid URL; nothing is created.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartRequest'
            example:
              partNumber: 7
      responses:
        '201':
          description: A presigned URL for the part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedPart'
              example:
                partNumber: 7
                uploadUrl: https://silo-api.spainip.es/myota-test-imports/imports/4d7b2e91-8c6a-4f35-b0d9-2e5a8c1f7b64/source?partNumber=7&X-Amz-Signature=…
                expiresAt: '2026-11-27T14:10:00Z'
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  /v1/imports/uploads/{sessionId}/complete:
    post:
      operationId: geodata.imports.completeUpload
      summary: Complete an upload session
      description: >-
        Assembles the parts, verifies the checksum against the one declared at
        the start, and returns the snapshot to use in `POST /v1/imports`. A
        checksum mismatch is `409`: the bytes that arrived are not the bytes the
        client meant to send, and an import must not be the thing that discovers
        that.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: A completed session cannot be completed again; a repeat returns the same snapshot.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompletion'
            example:
              parts:
                - partNumber: 1
                  etag: '"d41d8cd98f00b204e9800998ecf8427e"'
      responses:
        '200':
          description: The completed session and the snapshot it produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionCompleted'
              example:
                id: 4d7b2e91-8c6a-4f35-b0d9-2e5a8c1f7b64
                objectKey: imports/4d7b2e91-8c6a-4f35-b0d9-2e5a8c1f7b64/source
                sizeBytes: 1048576
                state: completed
                snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                completedAt: '2026-11-27T13:50:00Z'
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  # ───────────────────────────────────────────────────────────────────────────
  # Imports — runs
  # ───────────────────────────────────────────────────────────────────────────

  /v1/imports:
    get:
      operationId: geodata.imports.list
      summary: List import runs
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [uploaded, running, review, published, failed, cancelled]
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunPage'
              example:
                items:
                  - id: 7a3e9c25-4b1d-4f80-9c6a-2e8b5d1f3a74
                    sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                    programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                    snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                    stage: conflate
                    status: review
                    counts:
                      total: 4120
                      valid: 4098
                      invalid: 22
                      merged: 341
                      new: 3757
                    startedAt: '2026-11-27T13:55:00Z'
                    finishedAt: null
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
    post:
      operationId: geodata.imports.create
      summary: Start an import run from a snapshot
      description: >-
        Creates the run and queues `import.preprocess` as a job in `ops.job`. The
        job is the queue: there is no separate broker, and a worker claims it with
        `FOR UPDATE SKIP LOCKED` exactly as a broker's durable consumer would.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRunCreate'
            example:
              sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
              programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
              snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
      responses:
        '201':
          description: The created run, in `uploaded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
              example:
                id: 7a3e9c25-4b1d-4f80-9c6a-2e8b5d1f3a74
                sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                stage: upload
                status: uploaded
                counts:
                  total: 0
                  valid: 0
                  invalid: 0
                  merged: 0
                  new: 0
                startedAt: null
                finishedAt: null
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  /v1/imports/{runId}:
    get:
      operationId: geodata.imports.read
      summary: Read an import run
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The run with its counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
              example:
                id: 7a3e9c25-4b1d-4f80-9c6a-2e8b5d1f3a74
                sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                stage: conflate
                status: review
                counts:
                  total: 4120
                  valid: 4098
                  invalid: 22
                  merged: 341
                  new: 3757
                startedAt: '2026-11-27T13:55:00Z'
                finishedAt: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/imports/{runId}/cancel:
