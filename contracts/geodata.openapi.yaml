          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  # ───────────────────────────────────────────────────────────────────────────
  # Tiles
  # ───────────────────────────────────────────────────────────────────────────

  /v1/tiles/{z}/{x}/{y}.mvt:
    get:
      operationId: geodata.tiles.read
      summary: Fetch one vector tile
      description: |
        Anonymous. Mapbox Vector Tile, generated from the published catalogue
        with a `ST_AsMVT` query, so the map does not paginate a million polygons
        through a JSON endpoint.

        Tiles are cacheable and carry a long `Cache-Control`: the geometry for a
        published entity changes rarely, and a tile is regenerated only when the
        catalogue does.
      tags: [tiles]
      security: []
      parameters:
        - name: z
          in: path
          required: true
          description: Zoom level.
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: x
          in: path
          required: true
          description: Tile column.
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          description: Tile row.
          schema:
            type: integer
            minimum: 0
        - name: programme
          in: query
          required: false
          description: Restrict the tile to one programme.
          schema:
            type: string
      responses:
        '200':
          description: The tile bytes.
          headers:
            Cache-Control:
              description: Cacheable for a day; a catalogue change invalidates by
                the ETag rather than by a purge.
              schema:
                type: string
            ETag:
              description: Content hash of the tile.
              schema:
                type: string
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  # ───────────────────────────────────────────────────────────────────────────
  # Internal — never published
  # ───────────────────────────────────────────────────────────────────────────

  /internal/healthz:
    get:
      operationId: geodata.internal.health
      summary: Liveness for this service
      description: >-
        Answers whether this process is running and has a usable configuration.
        The gateway aggregates this into `/readyz`; nothing else calls it, and it
        is not published.
      tags: [geodata-internal]
      x-internal: true
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
              example:
                status: ok
                service: geodata
        '503':
          $ref: '../shared/components.yaml#/components/responses/ProblemServiceUnavailable'

  /internal/openapi.json:
    get:
      operationId: geodata.internal.openapi
      summary: This service's contract
      tags: [geodata-internal]
      x-internal: true
      security: []
      responses:
        '200':
          description: The service document, as JSON.
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1 document.
                additionalProperties: true
              example:
                openapi: 3.1.0
                info:
                  title: Myota geodata service
                  version: 1.0.0
        '503':
          $ref: '../shared/components.yaml#/components/responses/ProblemServiceUnavailable'

  /internal/events:
    get:
      operationId: geodata.internal.events
      summary: Pull committed events
      description: >-
        A read endpoint over `ops.outbox_event` in `myota_geo`. `core` and
        `activity` consume `entity.published`, `entity.retired` and
        `import.completed` from here.
      tags: [geodata-internal]
      x-internal: true
      security: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/EventCursor'
        - $ref: '../shared/components.yaml#/components/parameters/EventLimit'
        - $ref: '../shared/components.yaml#/components/parameters/EventTypes'
      responses:
        '200':
          description: One batch of events past the cursor.
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/EventFeed'
              example:
                events:
                  - seq: 4412
                    id: 7b2e9d14-3a6c-4f85-8e07-2d1c5a9b4f36
                    type: geodata.entity.published.v1
                    subject: entity:8f3c1e00-0000-4000-8000-000000000001
                    partition: 8
                    time: '2026-11-20T14:31:00Z'
                    data:
                      entityId: 8f3c1e00-0000-4000-8000-000000000001
                      programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                      entityTypeCode: park
                      name: Parque Nacional da Peneda-Gerês
                nextSeq: 4412
                more: false
        '503':
          $ref: '../shared/components.yaml#/components/responses/ProblemServiceUnavailable'

  /internal/events/ack:
    post:
      operationId: geodata.internal.ackEvents
      summary: Report a consumer's position
      tags: [geodata-internal]
      x-internal: true
      security: []
      x-idempotency: not-applicable
      x-idempotency-reason: The recorded position is monotonic; a lower seq is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../shared/components.yaml#/components/schemas/EventAck'
            example:
              consumer: activity
              source: geodata
              seq: 4412
      responses:
        '204':
          description: Recorded.
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'

components:
  schemas:
    GeoJsonGeometry:
      type: object
      description: >-
        A GeoJSON geometry object. Validated against the programme's
        `geometryPolicy` for the category before it is stored, so an import
        cannot put a polygon where a summit point belongs.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
        coordinates:
          description: GeoJSON coordinates. Depth depends on `type`, which is why
            this is not narrowed further here.
          oneOf:
            - type: array
              items: {type: number}
            - type: array
              items: {type: array}
            - type: array
              items: {type: array, items: {type: array}}
            - type: array
              items: {type: array, items: {type: array, items: {type: array}}}

    EntitySummary:
      type: object
      description: >-
        An entity in a list. Deliberately without geometry: a map viewport of 200
        entities should not be 200 polygons. `centroid` is enough to place a
        marker, and the detail endpoint is where the shape lives.
      required: [id, programmeId, entityTypeCode, name, slug, status, revision]
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
          description: Opaque reference to `core.programme`; no foreign key
            crosses the database boundary.
        entityTypeCode:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, in_review, published, retired]
        centroid:
          $ref: '#/components/schemas/GeoJsonGeometry'
        revision:
          type: integer
          minimum: 1
          description: Optimistic concurrency token. Every edit carries it.
        updatedAt:
          type: string
          format: date-time

    EntityDetail:
      allOf:
        - $ref: '#/components/schemas/EntitySummary'
        - type: object
          properties:
            geometry:
              $ref: '#/components/schemas/GeoJsonGeometry'
            elevationMetres:
              type: [number, 'null']
            categories:
              type: array
              items:
                $ref: '#/components/schemas/EntityCategory'
            publishedAt:
              type: [string, 'null']
              format: date-time
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'

    EntityCategory:
      type: object
      required: [code, primary]
      properties:
        code:
          type: string
        primary:
          type: boolean

    EntityPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EntitySummary'

    EntityCreate:
      type: object
      required: [programmeId, entityTypeCode, name, geometry]
      properties:
        programmeId:
          type: string
          format: uuid
        entityTypeCode:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 200
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        elevationMetres:
          type: [number, 'null']
        categories:
          type: array
          items:
            type: string

    EntityUpdate:
      type: object
      description: >-
        A partial edit. `revision` is required and is not optional-by-omission:
        an edit without a revision is an edit without a concurrency check, which
        is the behaviour this design removed.
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 200
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        elevationMetres:
          type: [number, 'null']
        categories:
          type: array
          items:
            type: string

    Attachment:
      type: object
      required: [id, kind, mediaType, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [photo, map, document]
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        objectKey:
          type: string
        uploadUrl:
          type: string
          format: uri
          description: Presigned `PUT` target. Absent once confirmed.
        uploadExpiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time

    AttachmentCreate:
      type: object
      required: [kind, mediaType, sizeBytes, checksumSha256]
      properties:
        kind:
          type: string
          enum: [photo, map, document]
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
          description: 8 MiB. Attachments are images and small documents, not
            datasets — those go through the import pipeline.
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    AuditEvent:
      type: object
      required: [id, action, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          examples: ['entity.published']
        actorId:
          type: [string, 'null']
          format: uuid
        occurredAt:
          type: string
          format: date-time
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true

    AuditEventPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEvent'

    Provenance:
      type: object
      required: [sourceId, sourceName, snapshotId, confidence]
      properties:
        sourceId:
          type: string
          format: uuid
        sourceName:
          type: string
        snapshotId:
          type: string
          format: uuid
        sourceFeatureId:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        retrievedAt:
          type: string
          format: date-time

    ProvenancePage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Provenance'

    Proposal:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [new_entity, correction]
        entityId:
          type: [string, 'null']
          format: uuid
        entityName:
          type: [string, 'null']
        programmeId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [open, approved, rejected, withdrawn]
        submittedBy:
          type: [string, 'null']
          format: uuid
          description: The `core` account id. Present only in the administrator view.
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        decisionNote:
          type: [string, 'null']

    ProposalDetail:
      allOf:
        - $ref: '#/components/schemas/Proposal'
        - type: object
          properties:
            note:
              type: [string, 'null']
            geometry:
              $ref: '#/components/schemas/GeoJsonGeometry'
            name:
              type: [string, 'null']

    ProposalCreate:
      type: object
      required: [kind, note]
      oneOf:
        - required: [entityId]
          properties:
            kind: {const: correction}
        - required: [programmeId, name, geometry]
          properties:
            kind: {const: new_entity}
      properties:
        kind:
          type: string
          enum: [new_entity, correction]
        entityId:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 200
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        note:
          type: string
          minLength: 10
          maxLength: 2000

    ProposalPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Proposal'

    UploadSession:
      type: object
      required: [id, objectKey, sizeBytes, state, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        objectKey:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [open, completed, aborted, expired]
        partSizeBytes:
          type: integer
        expiresAt:
          type: string
          format: date-time

    UploadSessionCompleted:
      allOf:
        - $ref: '#/components/schemas/UploadSession'
        - type: object
          properties:
            snapshotId:
              type: string
              format: uuid
            completedAt:
              type: string
              format: date-time

    UploadSessionCreate:
      type: object
      required: [sourceId, filename, sizeBytes, checksumSha256, format]
      properties:
        sourceId:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 1073741824
          description: 1 GiB, matching `MaxImportUploadBytes` in `libs/limits`.
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        format:
          type: string
          enum: [geojson, wfs_geojson, arcgis, kml, gpx, shapefile_zip, osm_pbf, csv_wkt]

    PartRequest:
      type: object
      required: [partNumber]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000

    SignedPart:
      type: object
      required: [partNumber, uploadUrl, expiresAt]
      properties:
        partNumber:
          type: integer
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    UploadCompletion:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, etag]
            properties:
              partNumber:
                type: integer
                minimum: 1
              etag:
                type: string

    ImportRun:
      type: object
      required: [id, sourceId, programmeId, stage, status, counts]
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        snapshotId:
          type: [string, 'null']
          format: uuid
        stage:
          type: string
          enum: [upload, normalise, validate, conflate, publish]
        status:
          type: string
          enum: [uploaded, running, review, published, failed, cancelled]
          description: >-
            `review` is a status, not a stage. "Awaiting an administrator" is not
            something the pipeline does, and modelling it as a stage made the
            legacy state machine 11 states wide.
        counts:
          $ref: '#/components/schemas/ImportCounts'
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time

    ImportCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        valid:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
        merged:
          type: integer
          minimum: 0
        new:
          type: integer
          minimum: 0

    ImportRunCreate:
      type: object
      required: [sourceId, programmeId, snapshotId]
      properties:
        sourceId:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid

    ImportRunPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImportRun'

    Candidate:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        sourceFeatureId:
          type: string
        state:
          type: string
          enum: [pending, valid, invalid, duplicate, promoted, rejected]
        rejectReason:
          type: [string, 'null']
        name:
          type: [string, 'null']
        centroid:
          $ref: '#/components/schemas/GeoJsonGeometry'

    CandidatePage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Candidate'

    ImportError:
      type: object
      required: [id, severity, code, message]
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: [string, 'null']
          format: uuid
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
          examples: ['geometry.self_intersection']
        message:
          type: string

    ImportErrorPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImportError'

    Conflation:
      type: object
      required: [id, candidateId, score, resolution]
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        entityId:
          type: [string, 'null']
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 1
        resolution:
          type: string
          enum: [new, merge, skip, unresolved]
        reason:
          type: object
          additionalProperties: true

    ConflationPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conflation'

    ConflationResolution:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [new, merge, skip]
        entityId:
          type: string
          format: uuid
          description: Required when `resolution` is `merge`.

    PublishRequest:
      type: object
      properties:
        maxCandidates:
          type: integer
          minimum: 1
          maximum: 300
          default: 300
          description: Matches `MaxPromotionBatchCandidates` in `libs/limits`.

    Source:
      type: object
      required: [id, name, adapter, defaultFormat, licence, attribution]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        adapter:
          type: string
          enum: [PARKSERVE_US, OSM, GOVERNMENT_GIS, MANUAL]
        defaultFormat:
          type: string
          enum: [geojson, wfs_geojson, arcgis, kml, gpx, shapefile_zip, osm_pbf, csv_wkt]
        licence:
          type: string
        attribution:
          type: string
        homepage:
          type: [string, 'null']
          format: uri

    SourceCreate:
      type: object
      required: [name, adapter, defaultFormat, licence, attribution]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        adapter:
          type: string
          enum: [PARKSERVE_US, OSM, GOVERNMENT_GIS, MANUAL]
        defaultFormat:
          type: string
          enum: [geojson, wfs_geojson, arcgis, kml, gpx, shapefile_zip, osm_pbf, csv_wkt]
        licence:
          type: string
          maxLength: 200
        attribution:
          type: string
          maxLength: 500
        homepage:
          type: string
          format: uri

    SourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        licence:
          type: string
          maxLength: 200
        attribution:
          type: string
          maxLength: 500
        homepage:
          type: string
          format: uri

    SourcePage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Source'

    Snapshot:
      type: object
      required: [id, checksum, retrievedAt]
      properties:
        id:
          type: string
          format: uuid
        checksum:
          type: string
        featureCount:
          type: integer
          minimum: 0
        retrievedAt:
          type: string
          format: date-time

    SnapshotPage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Snapshot'

    Schedule:
      type: object
      required: [id, cron, enabled]
      properties:
        id:
          type: string
          format: uuid
        cron:
          type: string
          description: Five-field cron, interpreted in UTC.
        enabled:
          type: boolean
        lastRunAt:
          type: [string, 'null']
          format: date-time

    ScheduleCreate:
      type: object
      required: [cron]
      properties:
        cron:
          type: string
        enabled:
          type: boolean
          default: true
        programmeId:
          type: string
          format: uuid

    ScheduleUpdate:
      type: object
      properties:
        cron:
          type: string
        enabled:
          type: boolean

    SchedulePage:
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Schedule'
