  /v1/imports/{runId}/candidates:
    get:
      operationId: geodata.imports.listCandidates
      summary: List a run's staged candidates
      description: >-
        The review screen. Each candidate is one feature from the source, in the
        state the validator left it, with the reason when it is invalid. Filtering
        by state is what makes a 4 000-feature run reviewable.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, valid, invalid, duplicate, promoted, rejected]
      responses:
        '200':
          description: One page of candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage'
              example:
                items:
                  - id: 2c9f5a73-6d1e-4b08-9f4a-3e7c2b5d1a68
                    sourceFeatureId: WDPA-555
                    state: valid
                    rejectReason: null
                    name: Parque Nacional da Peneda-Gerês
                    centroid:
                      type: Point
                      coordinates: [-8.2167, 41.7333]
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/imports/{runId}/errors:
    get:
      operationId: geodata.imports.listErrors
      summary: List a run's import errors
      description: >-
        Errors are per candidate and carry a code, so a systematic problem —
        every feature missing a name, say — is visible as a pattern rather than
        as 4 000 rows to read.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [error, warning]
      responses:
        '200':
          description: One page of errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportErrorPage'
              example:
                items:
                  - id: 8b4d1f62-9a3c-4e75-b0d8-5c2e7f1a3b96
                    candidateId: 2c9f5a73-6d1e-4b08-9f4a-3e7c2b5d1a68
                    severity: warning
                    code: geometry.self_intersection
                    message: Ring 1 self-intersects at (-8.31, 41.72); repaired with
                      a zero-width buffer.
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/imports/{runId}/conflations:
    get:
      operationId: geodata.imports.listConflations
      summary: List conflation candidates
      description: >-
        Each row is a proposed match between an imported feature and an existing
        entity, with a score and the reasons for it. `unresolved` rows are the
        ones a reviewer must decide before the run can publish.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
        - name: resolution
          in: query
          required: false
          schema:
            type: string
            enum: [new, merge, skip, unresolved]
      responses:
        '200':
          description: One page of conflation rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflationPage'
              example:
                items:
                  - id: 4e7a2c91-5b3d-4f68-a0c1-9e2b6d4f8a37
                    candidateId: 2c9f5a73-6d1e-4b08-9f4a-3e7c2b5d1a68
                    entityId: 8f3c1e00-0000-4000-8000-000000000001
                    score: 0.93
                    resolution: unresolved
                    reason:
                      nameSimilarity: 0.97
                      centroidDistanceMetres: 214
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/imports/{runId}/conflations/{candidateId}/resolve:
    post:
      operationId: geodata.imports.resolveConflation
      summary: Decide a conflation
      description: >-
        Records `merge`, `new` or `skip` for one candidate. Scope
        `geodata.review` is required per request, not merely a valid token — the
        legacy system got this wrong on exactly this endpoint.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: The decision is stored once per candidate; a repeat overwrites the same row.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflationResolution'
            example:
              resolution: merge
              entityId: 8f3c1e00-0000-4000-8000-000000000001
      responses:
        '200':
          description: The resolved row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflation'
              example:
                id: 4e7a2c91-5b3d-4f68-a0c1-9e2b6d4f8a37
                candidateId: 2c9f5a73-6d1e-4b08-9f4a-3e7c2b5d1a68
                entityId: 8f3c1e00-0000-4000-8000-000000000001
                score: 0.93
                resolution: merge
                reason:
                  nameSimilarity: 0.97
                  centroidDistanceMetres: 214
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  /v1/imports/{runId}/publish:
    post:
      operationId: geodata.imports.publish
      summary: Promote a reviewed run into the catalogue
      description: |
        Promotes the run's resolved candidates in batches of at most 300, so one
        transaction stays short enough to reason about. Every promoted entity
        writes its `entity_provenance` row in the same transaction as the entity,
        which is what makes attribution answerable later.

        Refused while any candidate is still `unresolved`: publishing a run with
        an undecided merge would double the catalogue.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            example:
              maxCandidates: 300
      responses:
        '202':
          description: Promotion queued; the run moves to `publishing`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
              example:
                id: 7a3e9c25-4b1d-4f80-9c6a-2e8b5d1f3a74
                sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                stage: publish
                status: running
                counts:
                  total: 4120
                  valid: 4098
                  invalid: 22
                  merged: 341
                  new: 3757
                startedAt: '2026-11-27T13:55:00Z'
                finishedAt: null
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  # ───────────────────────────────────────────────────────────────────────────
  # Sources and schedules
  # ───────────────────────────────────────────────────────────────────────────

  /v1/admin/sources:
    get:
      operationId: geodata.sources.list
      summary: List data sources
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
              example:
                items:
                  - id: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                    name: Protected Planet
                    adapter: GOVERNMENT_GIS
                    defaultFormat: geojson
                    licence: CC-BY-4.0
                    attribution: IUCN and UNEP-WCMC
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
    post:
      operationId: geodata.sources.create
      summary: Create a data source
      description: >-
        The licence and attribution are required fields, not notes: an entity
        derived from this source inherits them, and a catalogue that cannot state
        where it came from cannot be published.
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
            example:
              name: Protected Planet
              adapter: GOVERNMENT_GIS
              defaultFormat: geojson
              licence: CC-BY-4.0
              attribution: IUCN and UNEP-WCMC
              homepage: https://www.protectedplanet.net
      responses:
        '201':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              example:
                id: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                name: Protected Planet
                adapter: GOVERNMENT_GIS
                defaultFormat: geojson
                licence: CC-BY-4.0
                attribution: IUCN and UNEP-WCMC
                homepage: https://www.protectedplanet.net
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  /v1/admin/sources/{sourceId}:
    patch:
      operationId: geodata.sources.update
      summary: Update a data source
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
            example:
              licence: CC-BY-4.0
              attribution: IUCN and UNEP-WCMC, 2026 release
      responses:
        '200':
          description: The updated source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              example:
                id: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                name: Protected Planet
                adapter: GOVERNMENT_GIS
                defaultFormat: geojson
                licence: CC-BY-4.0
                attribution: IUCN and UNEP-WCMC, 2026 release
                homepage: https://www.protectedplanet.net
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '422':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnprocessable'

  /v1/admin/sources/{sourceId}/snapshots:
    get:
      operationId: geodata.sources.listSnapshots
      summary: List a source's snapshots
      description: >-
        One row per fetch: the exact bytes an import read, with a feature count
        and a checksum. Provenance points here, so "which version of the source
        produced this geometry" has an answer.
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/Cursor'
        - $ref: '../shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of snapshots, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
              example:
                items:
                  - id: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                    checksum: 9f2c6b1e4a8d3c7f0b5e9a2d6c4f8b1e3a7c0d5f9b2e6a4c8d1f7b3e0a9c6d52
                    featureCount: 4120
                    retrievedAt: '2026-11-18T03:00:00Z'
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'

  /v1/admin/sources/{sourceId}/schedules:
    get:
      operationId: geodata.sources.listSchedules
      summary: List a source's refresh schedules
      description: >-
        A schedule is a row with a cron expression and a unique
        `(kind, scheduled_for)` slot, not a cron loop inside a container. Two
        replicas therefore cannot both fetch the same source at 03:00.
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The source's schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
              example:
                items:
                  - id: 3b8e1d54-7c2a-4f96-8a0d-5e1b9c3f7a28
                    cron: '0 3 * * *'
                    enabled: true
                    lastRunAt: '2026-11-18T03:00:00Z'
                nextCursor: null
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
    post:
      operationId: geodata.sources.createSchedule
      summary: Schedule a periodic refresh
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
            example:
              cron: '0 3 * * *'
              programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
      responses:
        '201':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                id: 3b8e1d54-7c2a-4f96-8a0d-5e1b9c3f7a28
                cron: '0 3 * * *'
                enabled: true
                lastRunAt: null
        '400':
          $ref: '../shared/components.yaml#/components/responses/ProblemBadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '../shared/components.yaml#/components/responses/ProblemForbidden'
        '404':
          $ref: '../shared/components.yaml#/components/responses/ProblemNotFound'
        '409':
          $ref: '../shared/components.yaml#/components/responses/ProblemConflict'

  /v1/admin/sources/{sourceId}/schedules/{scheduleId}:
    patch:
      operationId: geodata.sources.updateSchedule
      summary: Enable, disable or retime a schedule
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
            example:
              enabled: false
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                id: 3b8e1d54-7c2a-4f96-8a0d-5e1b9c3f7a28
                cron: '0 3 * * *'
                enabled: false
                lastRunAt: '2026-11-18T03:00:00Z'
