    delete:
      operationId: geodata.sources.deleteSchedule
      summary: Remove a schedule
      tags: [sources]
      security:
        - adminBearer: []
        - adminSession: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
