      operationId: geodata.imports.cancel
      summary: Cancel an import run
      description: >-
        Stops the pipeline and discards the run's candidates. A run already in
        `review` is cancelled the same way; nothing was published, so nothing
        needs undoing.
      tags: [imports]
      security:
        - adminBearer: []
        - adminSession: []
      x-idempotency: not-applicable
      x-idempotency-reason: Cancelling a cancelled run is a no-op.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cancelled run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
              example:
                id: 7a3e9c25-4b1d-4f80-9c6a-2e8b5d1f3a74
                sourceId: 1c5e8a30-7d2b-4f96-a0e4-9b3c6d1f8a52
                programmeId: 7d2c9e14-3b6a-4f28-8c05-1e9a3d7b6f42
                snapshotId: 6d1b3f87-2a9c-4e05-b7d8-1f4a9c2e6b03
                stage: conflate
                status: cancelled
                counts:
                  total: 4120
                  valid: 4098
                  invalid: 22
                  merged: 341
                  new: 3757
                startedAt: '2026-11-27T13:55:00Z'
                finishedAt: '2026-11-27T14:05:00Z'
        '401':
          $ref: '../shared/components.yaml#/components/responses/ProblemUnauthorized'
        '403':
