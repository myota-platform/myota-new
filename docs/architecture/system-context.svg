<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 806" width="1180" height="806" role="img" aria-labelledby="ctxTitle ctxDesc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="ctxTitle">MyOTA target system context</title>
<desc id="ctxDesc">Two browser applications reach one API gateway over HTTPS. The gateway serves the composed OpenAPI contract and the playground, and routes to three domain services. Each service owns exactly one PostgreSQL database. Services exchange events through their own outbox tables, read by peers over an internal feed; there is no message broker.</desc>
