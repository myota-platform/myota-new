<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" role="img" aria-labelledby="scTitle scDesc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="scTitle">MyOTA horizontal scaling model</title>
<desc id="scDesc">Requests pass through a single Traefik ingress that owns rate limiting, then to any of N gateway replicas, then to any of N API, worker or relay replicas. Replicas share no local state: sessions are in Postgres, work is claimed with SKIP LOCKED, the relay leases partitions, and connections pass through PgBouncer.</desc>
<defs>
    <marker id="sarw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5"
            markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b62"/>
    </marker>
  </defs>
  <rect width="1180" height="690" fill="#f6f7f5"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">MyOTA — horizontal scaling</text>
  <text x="40" y="63" font-size="12" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Every tier is N replicas. No tier holds local state, so any replica serves any request and losing one is invisible.</text>
  <text x="40" y="111" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">CLIENTS</text>
  <rect x="300" y="96" width="320" height="40" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <text x="316" y="122" font-size="12" font-weight="550" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Admin console  ·  Participant app</text>
  <text x="40" y="191" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">INGRESS</text>
  <text x="40" y="206" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">one layer, global counters</text>
  <rect x="300" y="176" width="320" height="52" rx="9" fill="#e6f1ea" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="316" y="198" font-size="13" font-weight="700" fill="#2f6f4e" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Traefik</text>
  <text x="316" y="216" font-size="10" font-weight="400" fill="#2c4a3a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">rateLimit · circuitBreaker · retry · inFlightReq</text>
  <text x="40" y="283" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">GATEWAY</text>
  <text x="40" y="298" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">stateless · contracts embedded</text>
  <rect x="300" y="268" width="150" height="46" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <text x="312" y="288" font-size="11.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gateway-1</text>
  <text x="312" y="304" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">no state · no DB</text>
  <rect x="470" y="268" width="150" height="46" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <text x="482" y="288" font-size="11.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gateway-2</text>
  <text x="482" y="304" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">no state · no DB</text>
  <rect x="640" y="268" width="150" height="46" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <text x="652" y="288" font-size="11.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gateway-3</text>
  <text x="652" y="304" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">no state · no DB</text>
  <text x="806" y="296" font-size="11" font-weight="600" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">… N</text>
  <text x="40" y="375" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">SERVICES</text>
  <text x="40" y="390" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">api · worker · relay from one image</text>
  <rect x="300" y="360" width="150" height="84" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <rect x="300" y="360" width="4" height="84" rx="2" fill="#2f6f4e"/>
  <text x="314" y="382" font-size="12.5" font-weight="700" fill="#2f6f4e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">api ×N</text>
  <text x="314" y="400" font-size="9.5" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">sessions in Postgres</text>
  <text x="314" y="416" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">kill any replica</text>
  <text x="314" y="432" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">→ lease expires</text>
  <rect x="470" y="360" width="150" height="84" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <rect x="470" y="360" width="4" height="84" rx="2" fill="#9a6208"/>
