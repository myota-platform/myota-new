  <text x="484" y="400" font-size="9.5" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">claims with SKIP LOCKED</text>
  <text x="484" y="416" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">kill any replica</text>
  <text x="484" y="432" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">→ lease expires</text>
  <rect x="640" y="360" width="150" height="84" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <rect x="640" y="360" width="4" height="84" rx="2" fill="#1f5d8f"/>
  <text x="654" y="382" font-size="12.5" font-weight="700" fill="#1f5d8f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">relay ×N</text>
  <text x="654" y="400" font-size="9.5" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">leases partitions</text>
  <text x="654" y="416" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">kill any replica</text>
  <text x="654" y="432" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">→ lease expires</text>
  <text x="806" y="402" font-size="11" font-weight="600" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">… N</text>
  <text x="40" y="501" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">CONNECTION POOL</text>
  <text x="40" y="516" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">connections are the first wall</text>
  <rect x="300" y="486" width="490" height="52" rx="9" fill="#fbfcfb" stroke="#c7cec8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="316" y="508" font-size="12" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">PgBouncer · transaction mode · one per database</text>
  <text x="316" y="526" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">20 replicas × 20 client connections → 25 server connections</text>
  <text x="40" y="595" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">DATA</text>
  <text x="40" y="610" font-size="9.5" font-weight="400" fill="#8a978f" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">one owner per database</text>
