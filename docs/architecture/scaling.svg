  <text x="830" y="96" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">FRONT ENDS</text>
  <rect x="830" y="108" width="310" height="116" rx="9" fill="#ffffff" stroke="#c7cec8" stroke-width="1.3"/>
  <text x="846" y="132" font-size="12.5" font-weight="700" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">admin-web · participant-web ×N</text>
  <text x="846" y="154" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">static file tree · nginx</text>
  <text x="846" y="171" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">content-hashed assets, immutable cache</text>
  <text x="846" y="188" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">no session · no database client</text>
  <text x="846" y="205" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">scales on network throughput alone</text>
  <text x="830" y="268" font-size="10.5" font-weight="700" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" letter-spacing="0.09em">WHAT MAKES A TIER SAFE</text>
  <rect x="830" y="280" width="310" height="258" rx="9" fill="#fbfcfb" stroke="#c7cec8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="846" y="306" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Sessions</text>
  <text x="846" y="320" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Postgres, never memory</text>
  <text x="846" y="332" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Rate limits</text>
  <text x="846" y="346" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Traefik, never in-process</text>
  <text x="846" y="358" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Migrations</text>
  <text x="846" y="372" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">pre-deploy Job + advisory lock</text>
  <text x="846" y="384" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Scheduled work</text>
  <text x="846" y="398" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">ops.job UNIQUE (kind, bucket)</text>
  <text x="846" y="410" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Job claiming</text>
  <text x="846" y="424" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">FOR UPDATE SKIP LOCKED</text>
  <text x="846" y="436" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Relay</text>
  <text x="846" y="450" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">partition lease, not one leader</text>
  <text x="846" y="462" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Uploads</text>
  <text x="846" y="476" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">presigned S3, off the API</text>
  <text x="846" y="488" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Real-time</text>
  <text x="846" y="502" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">cursor polling, no WebSocket</text>
  <text x="846" y="514" font-size="10.5" font-weight="650" fill="#17201b" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Affinity</text>
  <text x="846" y="528" font-size="10" font-weight="400" fill="#5c6b62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">none, anywhere</text>
