# Reusable workflow: verify and publish one Rust service.
#
# Called by core.yml and geodata.yml, each with its own path filter.
#
# No stored secret. GITHUB_TOKEN with packages:write publishes to GHCR.

name: _service-rust

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      image:
        type: string
        required: true
      path:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # An absent directory means the chunk has not run; an existing directory
      # without a manifest means something is wrong. Only the second fails.
      - name: is the service scaffolded?
        id: scaffold
        run: |
          dir="${{ inputs.path }}"
          if [ ! -d "$dir" ]; then
            echo "::notice::$dir does not exist yet — nothing to build (chunk F1)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$dir/Cargo.toml" ]; then
            echo "::error file=$dir/Cargo.toml::$dir exists but has no Cargo.toml"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup rust
        if: steps.scaffold.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: '1.85'
          components: rustfmt, clippy
          cache-workspaces: ${{ inputs.path }}

      - name: rustfmt
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo fmt --all --check

      - name: clippy
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo test --all

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: does a Dockerfile exist?
        id: scaffold
        run: |
          if [ ! -f "${{ inputs.path }}/Dockerfile" ]; then
            echo "::notice::${{ inputs.path }}/Dockerfile does not exist yet — no image to publish"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup buildx
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        if: steps.scaffold.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.path }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PATH }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.key }}
          cache-to: type=gha,scope=${{ inputs.key }},mode=max

      - name: make the package public
        if: steps.scaffold.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ inputs.image }}" \
            -f visibility=public

      - name: pin the digest in the test values
        if: steps.scaffold.outputs.run == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: |
          file="deploy/fleet/myota-test/values.yaml"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file does not exist — the deploy skeleton is chunk F6, ordered before F7"
            exit 1
          fi
          python3 - "$file" "$IMAGE" "$REGISTRY_PATH" "$DIGEST" <<'PY'
          import re, sys
          path, image, ref, digest = sys.argv[1:5]
          text = open(path).read()
          pattern = re.compile(rf"(^\s*{re.escape(image)}:\s*).*$", re.M)
          if not pattern.search(text):
              sys.exit(f"no '{image}:' entry in {path}")
          text = pattern.sub(lambda m: f"{m.group(1)}{ref}@{digest}", text)
          open(path, "w").write(text)
          PY

      - name: commit the digest bump
        if: steps.scaffold.outputs.run == 'true'
        run: |
          if git diff --quiet; then
            echo "digest already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fleet/myota-test/values.yaml
          git commit -m "${{ inputs.key }} · pin ${{ inputs.image }} to ${{ steps.build.outputs.digest }}"
          git push
