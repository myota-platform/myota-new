# Reusable workflow: verify and publish one Rust service.
#
# Called by core.yml and geodata.yml, each with its own path filter.
#
# No stored secret. GITHUB_TOKEN with packages:write publishes to GHCR.

name: _service-rust

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      image:
        type: string
        required: true
      path:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # An absent directory means the chunk has not run; an existing directory
      # without a manifest means something is wrong. Only the second fails.
      - name: is the service scaffolded?
        id: scaffold
        run: |
          dir="${{ inputs.path }}"
          # See _service-go.yml: no directory, or a README-only directory, is a
          # placeholder. Rust source without a Cargo.toml is broken and fails.
          if [ ! -d "$dir" ] || { [ ! -f "$dir/Cargo.toml" ] && [ -z "$(find "$dir" -name '*.rs' -print -quit)" ]; }; then
            echo "::notice::$dir has no Rust source yet — nothing to build (chunk F1 scaffolds it)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$dir/Cargo.toml" ]; then
            echo "::error file=$dir/Cargo.toml::$dir has Rust source but no Cargo.toml"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup rust
        if: steps.scaffold.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: '1.85'
          components: rustfmt, clippy
          cache-workspaces: ${{ inputs.path }}

      - name: rustfmt
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo fmt --all --check

      - name: clippy
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: cargo test --all

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    # The whole publication path — idempotent tag, digest pin, anonymous pull — lives in one
    # reusable workflow rather than three copies that drift. See `.github/workflows/_image.yml`.
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: write   # the digest pin is a commit
      packages: write   # the image
    with:
      key: ${{ inputs.key }}
      image: ${{ inputs.image }}
      dockerfile: ${{ inputs.path }}/Dockerfile
      context: .
