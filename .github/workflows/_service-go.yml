# Reusable workflow: verify and publish one Go service.
#
# Called by gateway.yml and activity.yml, each with its own path filter, so a
# change to one service never builds the other. The shared body lives here once.
#
# No stored secret is used. GITHUB_TOKEN with packages:write publishes to GHCR;
# the cluster credential does not exist, because CD is a commit rather than a push
# to a cluster.

name: _service-go

on:
  workflow_call:
    inputs:
      key:
        description: Chunk/service key used in commit messages, e.g. gateway
        type: string
        required: true
      image:
        description: Image name without registry or tag
        type: string
        required: true
      path:
        description: Directory containing go.mod
        type: string
        required: true
      publish:
        description: Build and push an image on main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before the toolchain, deliberately. `setup-go` with a cache path that does
      # not exist yet warns on every run, and noise in a green build is how people
      # stop reading logs.
      #
      # An absent directory means the chunk has not run; an existing directory
      # without a manifest means something is wrong. Only the second fails.
      - name: is the service scaffolded?
        id: scaffold
        run: |
          dir="${{ inputs.path }}"
          # Three states, not two. No directory, or a directory holding only a
          # README, is a placeholder the plan has not reached. A directory with Go
          # source but no go.mod is broken. Only the last fails — a red build for
          # work that has not happened yet is noise, and noise in a green build is
          # how people stop reading logs.
          if [ ! -d "$dir" ] || { [ ! -f "$dir/go.mod" ] && [ -z "$(find "$dir" -name '*.go' -print -quit)" ]; }; then
            echo "::notice::$dir has no Go source yet — nothing to build (chunk F1 scaffolds it)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$dir/go.mod" ]; then
            echo "::error file=$dir/go.mod::$dir has Go source but no go.mod"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup go
        if: steps.scaffold.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ inputs.path }}/go.sum

      - name: gofmt
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: go vet ./...

      - name: test
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: go test -race -count=1 ./...

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commit the digest bump
      packages: write   # push to GHCR
    env:
      # One definition of the image reference. Two is how a tag and a digest end
      # up disagreeing.
      REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: does a Dockerfile exist?
        id: scaffold
        run: |
          if [ ! -f "${{ inputs.path }}/Dockerfile" ]; then
            echo "::notice::${{ inputs.path }}/Dockerfile does not exist yet — no image to publish"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup buildx
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        if: steps.scaffold.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.path }}/Dockerfile
          push: true
          # a moving tag for humans, a digest for the cluster
          tags: ${{ env.REGISTRY_PATH }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.key }}
          cache-to: type=gha,scope=${{ inputs.key }},mode=max

      - name: package visibility
        if: steps.scaffold.outputs.run == 'true'
        # Measured, not assumed: a package published by this job is **public** and linked to
        # the repository, because GITHUB_TOKEN publishing from a public repository inherits
        # public visibility. A package pushed from a laptop with a personal token is private
        # and unlinked, and no API can change it afterwards — REST has no visibility endpoint
        # any more and GraphQL exposes none either. So the rule is "publish here, never by
        # hand", and this step says so instead of calling an endpoint that does not exist.
        run: |
          echo "::notice::${{ inputs.image }} is public because this job published it with GITHUB_TOKEN from a public repository — do not push it by hand, a personal-token push creates a private, unlinked package that no API can fix"

      - name: pin the digest in the test values
        if: steps.scaffold.outputs.run == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: |
          file="deploy/fleet/myota-test/values.yaml"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file does not exist — the deploy skeleton is chunk F6, ordered before F7"
            exit 1
          fi
          python3 - "$file" "$IMAGE" "$REGISTRY_PATH" "$DIGEST" <<'PY'
          import re, sys
          path, image, ref, digest = sys.argv[1:5]
          text = open(path).read()
          # anchored on the exact key, so "core" does not also rewrite "core-worker"
          pattern = re.compile(rf"(^\s*{re.escape(image)}:\s*).*$", re.M)
          if not pattern.search(text):
              sys.exit(f"no '{image}:' entry in {path}")
          text = pattern.sub(lambda m: f"{m.group(1)}{ref}@{digest}", text)
          open(path, "w").write(text)
          PY

      - name: commit the digest bump
        if: steps.scaffold.outputs.run == 'true'
        run: |
          if git diff --quiet; then
            echo "digest already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fleet/myota-test/values.yaml
          # no [skip ci] needed: deploy/ is in no component's path filter
          git commit -m "${{ inputs.key }} · pin ${{ inputs.image }} to ${{ steps.build.outputs.digest }}"
          git push
