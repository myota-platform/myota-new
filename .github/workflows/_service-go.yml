# Reusable workflow: verify and publish one Go service.
#
# Called by gateway.yml and activity.yml, each with its own path filter, so a
# change to one service never builds the other. The shared body lives here once.
#
# No stored secret is used. GITHUB_TOKEN with packages:write publishes to GHCR;
# the cluster credential does not exist, because CD is a commit rather than a push
# to a cluster.

name: _service-go

on:
  workflow_call:
    inputs:
      key:
        description: Chunk/service key used in commit messages, e.g. gateway
        type: string
        required: true
      image:
        description: Image name without registry or tag
        type: string
        required: true
      path:
        description: Directory containing go.mod
        type: string
        required: true
      publish:
        description: Build and push an image on main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before the toolchain, deliberately. `setup-go` with a cache path that does
      # not exist yet warns on every run, and noise in a green build is how people
      # stop reading logs.
      #
      # An absent directory means the chunk has not run; an existing directory
      # without a manifest means something is wrong. Only the second fails.
      - name: is the service scaffolded?
        id: scaffold
        run: |
          dir="${{ inputs.path }}"
          # Three states, not two. No directory, or a directory holding only a
          # README, is a placeholder the plan has not reached. A directory with Go
          # source but no go.mod is broken. Only the last fails — a red build for
          # work that has not happened yet is noise, and noise in a green build is
          # how people stop reading logs.
          if [ ! -d "$dir" ] || { [ ! -f "$dir/go.mod" ] && [ -z "$(find "$dir" -name '*.go' -print -quit)" ]; }; then
            echo "::notice::$dir has no Go source yet — nothing to build (chunk F1 scaffolds it)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$dir/go.mod" ]; then
            echo "::error file=$dir/go.mod::$dir has Go source but no go.mod"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup go
        if: steps.scaffold.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ inputs.path }}/go.sum

      - name: gofmt
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: go vet ./...

      - name: test
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: go test -race -count=1 ./...

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    # The whole publication path — idempotent tag, digest pin, anonymous pull — lives in one
    # reusable workflow rather than three copies that drift. See `.github/workflows/_image.yml`.
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: write   # the digest pin is a commit
      packages: write   # the image
    with:
      key: ${{ inputs.key }}
      image: ${{ inputs.image }}
      dockerfile: ${{ inputs.path }}/Dockerfile
      context: .
