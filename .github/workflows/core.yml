# core (Rust). Identity, roles, programmes, email flows — the highest-risk service,
# so it is the only one whose migrations are a trigger of their own.
name: core

on:
  push:
    branches: [main]
    paths:
      - 'apps/core/**'
      - 'contracts/**'
      - 'libs/ops/rust/**'
      - 'libs/limits/rust/**'
      - 'deploy/myota/db/core/**'
      - '.github/workflows/core.yml'
      - '.github/workflows/_service-rust.yml'
  pull_request:
    paths:
      - 'apps/core/**'
      - 'contracts/**'
      - 'libs/ops/rust/**'
      - 'libs/limits/rust/**'
      - 'deploy/myota/db/core/**'
      - '.github/workflows/core.yml'
      - '.github/workflows/_service-rust.yml'

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    uses: ./.github/workflows/_service-rust.yml
    permissions:
      contents: write
      packages: write
    with:
      key: A1
      image: myota-new-core
      path: apps/core
      publish: ${{ github.ref == 'refs/heads/main' }}

  # The sign-in flow against a real PostgreSQL.
  #
  # Not part of the reusable verify job: `_service-rust.yml` is shared with `geodata`
  # and should not grow a database because one crate needs one. This job applies the
  # committed baselines to a throwaway server and runs the integration suite against
  # it, so "five wrong passwords lock the account" is checked against the SQL that
  # does the locking rather than against a mock.
  integration:
    name: sign-in flow
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      CORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/myota_core?sslmode=disable
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: apply the committed baselines
        env:
          ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          psql "$ADMIN_URL" -c "CREATE DATABASE myota_core"
          for file in deploy/myota/db/shared/*.sql deploy/myota/db/core/*.sql; do
            echo "applying $file"
            psql -v ON_ERROR_STOP=1 -q "$CORE_TEST_DATABASE_URL" -f "$file"
          done

      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: '1.85'
          cache-workspaces: apps/core

      - name: integration suite
        # Both suites: the sign-in flow and the authority flow. They share a harness, and
        # both need the committed baselines — including the seeded role catalogue.
        working-directory: apps/core
        run: cargo test --test auth_flow --test authority_flow
