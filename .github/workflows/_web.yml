# Reusable workflow: build and publish one static front end.
#
# Called by admin-web.yml and participant-web.yml. Both are static trees served by
# nginx — no server runtime, so "verify" is build + accessibility + the UI sweep.

name: _web

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      image:
        type: string
        required: true
      path:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.path }}/package-lock.json

      - name: check the app exists
        run: |
          if [ ! -f "${{ inputs.path }}/package.json" ]; then
            echo "::error file=${{ inputs.path }}/package.json::no package.json — scaffold this app"
            exit 1
          fi

      - name: install
        working-directory: ${{ inputs.path }}
        run: npm ci

      - name: lint
        working-directory: ${{ inputs.path }}
        run: npm run lint --if-present

      - name: unit tests
        working-directory: ${{ inputs.path }}
        run: npm test --if-present

      - name: build
        working-directory: ${{ inputs.path }}
        run: npm run build

      # The design system is shared source, so a front end that drifted from it
      # is a defect regardless of whether its own tests pass.
      - name: design-system conformance
        run: python3 tools/check_design_system.py "${{ inputs.path }}"

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      # one definition of the image reference; a second one is how a tag and a
      # digest end up disagreeing
      REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.path }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PATH }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.key }}
          cache-to: type=gha,scope=${{ inputs.key }},mode=max

      - name: make the package public
        continue-on-error: true
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ inputs.image }}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pin the digest in the test values
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: |
          file="deploy/fleet/myota-test/values.yaml"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file does not exist — the deploy skeleton is chunk F6"
            exit 1
          fi
          python3 - "$file" "$IMAGE" "$REGISTRY_PATH" "$DIGEST" <<'PY'
          import re, sys
          path, image, ref, digest = sys.argv[1:5]
          text = open(path).read()
          pattern = re.compile(rf"(^\s*{re.escape(image)}:\s*).*$", re.M)
          if not pattern.search(text):
              sys.exit(f"no '{image}:' entry in {path}")
          # the full registry path, not the bare name: ghcr.io/<owner>/<image>
          text = pattern.sub(lambda m: f"{m.group(1)}{ref}@{digest}", text)
          open(path, "w").write(text)
          PY

      - name: commit the digest bump
        run: |
          if git diff --quiet; then
            echo "digest already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fleet/myota-test/values.yaml
          git commit -m "${{ inputs.key }} · pin ${{ inputs.image }} to ${{ steps.build.outputs.digest }}"
          git push
