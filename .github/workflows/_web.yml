# Reusable workflow: build and publish one static front end.
#
# Called by admin-web.yml and participant-web.yml. Both are static trees served by
# nginx — no server runtime — so "verify" is build + lint + the design-system check.

name: _web

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      image:
        type: string
        required: true
      path:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: is the app scaffolded?
        id: scaffold
        run: |
          dir="${{ inputs.path }}"
          # See _service-go.yml. A README-only directory is a placeholder; app
          # source without a package.json is broken. Chunks A3 and P2 create the
          # manifests, and F1 deliberately does not — a package.json without a
          # lockfile would make `npm ci` fail on work nobody has started.
          app_source="$(find "$dir" \( -name '*.ts' -o -name '*.js' -o -name '*.svelte' -o -name '*.vue' -o -name '*.html' \) -not -name 'README.md' -print -quit 2>/dev/null)"
          if [ ! -d "$dir" ] || { [ ! -f "$dir/package.json" ] && [ -z "$app_source" ]; }; then
            echo "::notice::$dir has no app source yet — nothing to build (chunks A3 / P2)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$dir/package.json" ]; then
            echo "::error file=$dir/package.json::$dir has app source but no package.json"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup node
        if: steps.scaffold.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.path }}/package-lock.json

      - name: install
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: npm ci

      - name: lint
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: npm run lint --if-present

      - name: unit tests
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: npm test --if-present

      - name: build
        if: steps.scaffold.outputs.run == 'true'
        working-directory: ${{ inputs.path }}
        run: npm run build

      # The design system is shared source. A front end that drifted from it is a
      # defect regardless of whether its own tests pass.
      - name: design-system conformance
        if: steps.scaffold.outputs.run == 'true'
        run: python3 tools/check_design_system.py "${{ inputs.path }}"

  image:
    name: image
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: does a Dockerfile exist?
        id: scaffold
        run: |
          if [ ! -f "${{ inputs.path }}/Dockerfile" ]; then
            echo "::notice::${{ inputs.path }}/Dockerfile does not exist yet — no image to publish"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup buildx
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        if: steps.scaffold.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        if: steps.scaffold.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.path }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PATH }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.key }}
          cache-to: type=gha,scope=${{ inputs.key }},mode=max

      - name: package visibility is a maintainer step
        if: steps.scaffold.outputs.run == 'true'
        # A first push creates the package *private*, and no workflow can change that:
        # GITHUB_TOKEN answers 404 for both the read and the write (measured — AGENTS.md
        # rule 8). This step used to ask the API anyway with continue-on-error, so it
        # failed silently on every run. The flip is `make packages-public`.
        run: |
          echo "::notice::if ${{ inputs.image }} was just created, run 'make packages-public' once — the first push is always private"

      - name: pin the digest in the test values
        if: steps.scaffold.outputs.run == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: |
          file="deploy/fleet/myota-test/values.yaml"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file does not exist — the deploy skeleton is chunk F6"
            exit 1
          fi
          python3 - "$file" "$IMAGE" "$REGISTRY_PATH" "$DIGEST" <<'PY'
          import re, sys
          path, image, ref, digest = sys.argv[1:5]
          text = open(path).read()
          pattern = re.compile(rf"(^\s*{re.escape(image)}:\s*).*$", re.M)
          if not pattern.search(text):
              sys.exit(f"no '{image}:' entry in {path}")
          text = pattern.sub(lambda m: f"{m.group(1)}{ref}@{digest}", text)
          open(path, "w").write(text)
          PY

      - name: commit the digest bump
        if: steps.scaffold.outputs.run == 'true'
        run: |
          if git diff --quiet; then
            echo "digest already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fleet/myota-test/values.yaml
          git commit -m "${{ inputs.key }} · pin ${{ inputs.image }} to ${{ steps.build.outputs.digest }}"
          git push
