# Values for the `myota` chart. One chart, two environments; the namespace and these
# values are the only difference between them.
#
# Nothing here is secret. The database passwords live in Secrets that are applied by
# hand from `secrets/*.sops.yaml` (ADR-0003), and the chart refers to them by name so a
# `helm install` never carries a credential.

# ─── Databases ───────────────────────────────────────────────────────────────────
#
# Three, one per service, because a service is defined by the database it exclusively
# owns (ADR-0001). Merging them would let one service's load profile decide another's
# availability, and would delete the only structural reason the service boundaries are
# where they are.
databases:
  core:
    # The name is used for the StatefulSet, the Service, the PVC and the Secret; the
    # Verify command in the issue names `sts/myota-geo-postgres`, so this pattern is
    # fixed.
    database: myota_core
    # Plain PostgreSQL: core needs identity, programmes and a notification ledger, and
    # none of that is spatial. An extension it does not use is an extension that has to
    # be patched.
    image: postgres:16.4-alpine
    storage: 10Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  geo:
    database: myota_geo
    # The only one with PostGIS. Built from the official postgis image rather than
    # installing the extension at init: the extension needs a matching server build, and
    # "install it at startup" is a startup that can fail halfway.
    image: postgis/postgis:16-3.4
    storage: 20Gi
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
  activity:
    database: myota_activity
    image: postgres:16.4-alpine
    storage: 10Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}

# ─── PostgreSQL ──────────────────────────────────────────────────────────────────
postgres:
  # 200 connections per instance. PgBouncer multiplexes application connections onto a
  # small server pool, so this ceiling is headroom for the pooler and for a migration Job
  # — not a number that grows with replica count. Raising it costs a backend process per
  # connection, which is memory the node does not have spare.
  maxConnections: 200
  # The superuser, used by the migration Job and by an operator running psql. It is not
  # used by any service.
  superuser: postgres
  # The role services connect as, through PgBouncer. Created by the init script on first
  # start of an empty volume.
  appUser: myota
  # The Secret holding `superuser-password` and `app-password`. Applied out of band.
  existingSecret: ""   # defaults to myota-<name>-db-db-credentials, set per database below
  # `retained-local-path` has reclaimPolicy: Retain, so deleting the StatefulSet does not
  # delete the volume. On a single-node cluster where the volume is a directory on the
  # same disk as everything else, `Delete` is the difference between a mistake and a loss.
  storageClass: retained-local-path
  # Not `Always`: a database that restarts on every helm upgrade is a database that takes
  # an outage for a values change it does not use.
  imagePullPolicy: IfNotPresent
  # The init scripts run only when the data directory is empty, which is what makes
  # "create the app role" safe to keep in the chart forever.
  initdbScripts: {}

# ─── PgBouncer ──────────────────────────────────────────────────────────────────
pgbouncer:
  enabled: true
  image: edoburu/pgbouncer:v1.23.1-p3
  # Transaction mode. The application does not use session-scoped state — no advisory
  # locks held across requests, no prepared statements outside a transaction, no
  # `SET` that outlives a request — which is what makes pooling safe. See
  # docs/architecture/scaling.md.
  poolMode: transaction
  # Server connections per (database, user) pair. Small on purpose: PgBouncer's job is to
  # make 25 server connections serve hundreds of clients, and a large pool defeats it.
  defaultPoolSize: 25
  # The client-side ceiling per pooler. This is the number that can be raised freely,
  # because a client connection is cheap and a server connection is not.
  maxClientConn: 500
  # Prepared statements tracked per client connection. Required for transaction mode
  # with a driver that names its statements (sqlx, pgx in extended-query mode); see the
  # deployment template for what happens without it.
  maxPreparedStatements: 200
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# ─── Migrations ─────────────────────────────────────────────────────────────────
migrate:
  # A Job, not an init container and not a replica at startup: a replica that migrates
  # means N replicas racing to apply the same DDL, and AGENTS.md rule 12 forbids it.
  enabled: true
  # The image supplies `psql`. It matches the server major version so a client-version
  # mismatch cannot silently change behaviour.
  image: postgres:16.4-alpine
  # How long the advisory lock waits before giving up. A migration set this size takes
  # seconds; a minute of waiting means another Job is stuck, not busy.
  lockTimeout: 60s
  # Run again on every helm upgrade, because a released chart may carry a migration the
  # running database has not seen. The job is idempotent, so the usual case is a fast
  # no-op.
  backoffLimit: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# ─── Namespace ──────────────────────────────────────────────────────────────────
namespace:
  # Off by default. A chart cannot create the namespace it is installed into — the release
  # namespace must exist first — so this is only usable when something else (the Fleet
  # bundle's `defaultNamespace`) has already created it. See templates/namespace.yaml.
  create: false
  name: ""

# ─── Front ends ─────────────────────────────────────────────────────────────────
#
# Placeholders for F6: they prove the hostname, the certificate and the route before any
# application exists. A3 replaces the participant image and P2 the admin one; the Service
# name and port do not change, so the route and the certificate are proven once.
#
# Off by default so a production release cannot ship a "deployment skeleton" page.
# ─── Application services ─────────────────────────────────────────────────────────
#
# The gateway and `core`. Off by default so the chart renders for the database-only
# case (F5's checks) and for an environment that has not published images yet; every
# environment that serves traffic turns them on in its own values file.
#
# Their images are digests, written by CI into `images:` below. The names come from
# `deploy/fleet/<env>/values.yaml` too — one place per environment.
services:
  core:
    enabled: false
    replicas: 2
    port: 8080
    # The label an authenticator app shows. Not secret, and different per environment
    # so a test enrolment is recognisable in the app that scans it.
    otpIssuer: Myota
    # The key id published in the JWKS. Bumped when the signing key rotates, which is
    # what lets the gateway hold both keys during the overlap.
    signingKeyID: core-1
    logLevel: info
    database:
      # The pooler, never the database: AGENTS.md rule 17 makes it the only path.
      host: ""
      port: 6432
      name: myota_core
      user: myota
      # The Secret applied by hand from `secrets/core.sops.yaml` (ADR-0003).
      secretName: myota-core-db-credentials
      secretKey: app-password
    # Holds `jwt-seed-base64` and `mfa-key-base64`. Applied by hand; a bundle that
    # could carry it would be a bundle that could leak it.
    signingSecretName: myota-core-signing
    # Holds `clients.json`: a JSON object of service name to secret, for the
    # client-credentials exchange at `/internal/token`. Optional, and absent means no
    # service may call an internal endpoint — the endpoint refuses everything rather
    # than trusting an unauthenticated caller.
    serviceClientsSecretName: myota-core-service-clients
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  gateway:
    enabled: false
    replicas: 2
    port: 8080
    jwtIssuer: myota-core
    requestTimeout: 10s
    logLevel: info
    # Every one of these must be set: the gateway refuses to start otherwise, so a
    # typo is a pod that does not come up rather than a prefix that 500s.
    upstreams:
      core: http://core:8080
      geodata: http://geodata:8080
      activity: http://activity:8080
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}

# The API prefix every host serves, routed to the gateway.
#
# Traefik picks the longer rule, and the explicit priority removes the doubt: the API
# route wins over the front end's catch-all on the same host. Same origin for both
# applications is what keeps the session cookie first-party and removes CORS from the
# design entirely.
api:
  enabled: false
  service: gateway
  port: 8080
  priority: 100
  # The paths that belong to the gateway rather than to the front end. `/v1` is the API;
  # the rest is the gateway's own surface — the composed contract, the Scalar playground
  # and the event-schema index — which an API-first project has to publish somewhere.
  # Without these the playground is unreachable from the hostname that documents it.
  pathPrefixes:
    - /v1
    - /docs
    - /event-schemas
  exactPaths:
    - /openapi.json

web:
  # One entry per front end. `placeholder: true` renders the nginx page that proves the
  # hostname, the certificate and the route before the application exists; `false`
  # renders the application's own image from `images.<name>`. Both keep the same Service
  # name and port, so the IngressRoute and the certificate are proven once and never
  # change when the real application lands.
  apps:
    participant-web:
      title: Myota
      chunk: P2
      placeholder: true
      replicas: 2
    admin-web:
      title: Myota administration
      chunk: A3
      # The chart's default is the placeholder: it renders with no images at all, which is
      # the state F5's database-only check needs. An environment that has published the
      # console flips this in its own values — see `deploy/fleet/myota-test/values.yaml`.
      placeholder: true
      replicas: 2
  # The image the placeholders use. Real front ends come from `images.<name>`, written by
  # CI with a digest.
  placeholder:
    image: nginx:1.27-alpine
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
  # Resources for a real front end: nginx serving a static tree is small, and the limit
  # exists so a runaway response cannot take the node.
  app:
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 128Mi}
  ingress:
    enabled: false
    hosts:
      participant-web: ""
      admin-web: ""
