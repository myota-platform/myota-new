{{- /*
The two front ends, as placeholders.

Chunk F6 has one job: make both hostnames answer 200 with a valid certificate before any
feature exists, so every later chunk deploys into something real. A3 replaces the admin image
and P2 the participant one; the Service name, the port and the route stay, so the certificate
and the DNS record are proven once rather than re-proven per app.

Why nginx and not something smaller: the real front ends are static trees behind a web
server, so the placeholder is the same shape as what replaces it — a container listening on
80, a Service on 8080, configuration from a ConfigMap. A placeholder answering from a
different mechanism would verify a path the real application does not take.

The page lives in its own ConfigMap key rather than inline in the nginx config. Inline HTML
inside a `return 200 '...'` is a YAML quoting problem first and a readability problem second;
a file served by `try_files` is neither.
*/ -}}
{{- range $name, $web := .Values.web.apps }}
{{- if $web.placeholder }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-placeholder
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.web: {{ $name }}
data:
  # `= /healthz` is an exact match, not a prefix, so a mistyped path is a 404 rather than a
  # 200 from a catch-all — a route mistake should be visible, not masked.
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
        }

        # Anything else: a 404. The placeholder has exactly two pages, and pretending
        # otherwise would hide a route pointing at the wrong path.
        location / {
            return 404;
        }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>{{ $web.title }}</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          body { font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; margin: 0;
                 display: grid; place-items: center; min-height: 100vh;
                 background: #faf7f2; color: #2b2620; }
          main { max-width: 34rem; padding: 2rem; }
          h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
          p { margin: .5rem 0; color: #5a5248; }
          code { background: #efe9df; padding: .1rem .35rem; border-radius: .25rem; }
        </style>
      </head>
      <body>
        <main>
          <h1>{{ $web.title }}</h1>
          <p>Deployment skeleton. This page proves the hostname, the certificate and the route.</p>
          <p>The application arrives in chunk <code>{{ $web.chunk }}</code>.</p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.web: {{ $name }}
spec:
  # Two replicas from the first day, because the property being proven is that any replica
  # serves any request (ADR-0005). One replica lets a Service-level mistake — affinity, a
  # pinned pod — go unnoticed until the second is added.
  replicas: {{ $web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "myota.labels" $ | nindent 8 }}
        myota.web: {{ $name }}
      annotations:
        checksum/config: {{ toYaml $web | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ $.Values.web.placeholder.image }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $.Values.web.placeholder.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.web: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    # Port 8080, target 80. The issue names 8080 in the Service reference and the
    # IngressRoute repeats it; keeping the Service contract at 8080 means a later container
    # can move to a non-root port without the route changing.
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
