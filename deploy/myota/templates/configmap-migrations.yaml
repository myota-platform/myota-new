{{- /*
The migrations, as ConfigMaps, one per database.

The SQL lives in `deploy/myota/db/` and is rendered here rather than baked into an image,
so a migration is reviewed in the same pull request as the chart change that ships it. The
files are applied in filename order: `000_` shared, `010_` the database's baseline, `020_`
the trigger.
*/ -}}
{{- $root := . }}
{{- range $name, $db := .Values.databases }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.postgresName" (dict "root" $root "name" $name) }}-migrations
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "myota.labels" $root | nindent 4 }}
    myota.database: {{ $name }}
data:
  {{- /* Shared migrations first: the ops schema and the trigger every database needs. */}}
  {{- range $path, $_ := $root.Files.Glob "db/shared/*.sql" }}
  {{ base $path }}: |
    {{- $root.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- range $path, $_ := $root.Files.Glob (printf "db/%s/*.sql" $name) }}
  {{ base $path }}: |
    {{- $root.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
