{{- /*
The API gateway: routing, the contract, the playground, and the audience check.

It holds no database and no session state, so every replica is identical and any
replica can answer any request (ADR-0005). The verification key is fetched from
`core`'s JWKS at runtime (ADR-0008), which is what makes a key rotation a `core`
deploy rather than two.

Three upstreams are configured even though only `core` exists today. The gateway
refuses to start with an unconfigured upstream — that check is deliberate, because a
service that starts and then 500s on a prefix is harder to diagnose than one that
says which prefix it does not know. `/readyz` reports the ones that are unreachable
and answers 200 while at least one is up, so a missing `geodata` degrades the console
instead of taking the gateway out of its Service.
*/ -}}
{{- if .Values.services.gateway.enabled }}
{{- $gateway := .Values.services.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myota.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    myota.service: gateway
spec:
  replicas: {{ $gateway.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        {{- include "myota.labels" . | nindent 8 }}
        myota.service: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ required "images.gateway is required when services.gateway.enabled" .Values.images.gateway }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $gateway.port }}
          env:
            - name: GATEWAY_LISTEN_ADDR
              value: "0.0.0.0:{{ $gateway.port }}"
            - name: GATEWAY_JWT_ISSUER
              value: {{ $gateway.jwtIssuer | quote }}
            - name: GATEWAY_REQUEST_TIMEOUT
              value: {{ $gateway.requestTimeout | quote }}
            {{- range $service, $url := $gateway.upstreams }}
            - name: GATEWAY_UPSTREAM_{{ $service | upper }}
              value: {{ $url | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ $gateway.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myota.labels" . | nindent 4 }}
    myota.service: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: {{ $gateway.port }}
      targetPort: http
{{- end }}
