{{- /*
One PgBouncer per database, in transaction mode.

Why a pooler at all, and why one each: connections, not CPUs, are the first scaling wall
(docs/architecture/scaling.md). A service scaled to ten replicas opens ten pools; without a
pooler each pool's connections are backend processes on a single node, and `max_connections`
arrives long before CPU does.

One pooler per database rather than one shared: a shared pooler would let the largest
tenant's connection burst starve the others, and would couple three services' restarts. The
cost is three small Deployments, which is cheaper than the coupling.
*/ -}}
{{- if .Values.pgbouncer.enabled }}
{{- range $name, $db := .Values.databases }}
{{- $ctx := dict "root" $ "name" $name "database" $db.database }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.pgbouncerName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.database: {{ $name }}
spec:
  # A ClusterIP, unlike the database: the pooler is stateless and many replicas may serve
  # the same client, so a stable virtual address is exactly right.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "myota.pgbouncerName" $ctx }}
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.pgbouncerName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.database: {{ $name }}
spec:
  # Two replicas: a pooler restart should not be a client-visible event. Sticky sessions
  # are not a thing here — transaction pooling means any client may land on any replica
  # for any request, which is the same property that lets the services scale.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "myota.pgbouncerName" $ctx }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "myota.pgbouncerName" $ctx }}
        {{- include "myota.labels" $ | nindent 8 }}
        myota.database: {{ $name }}
    spec:
      # Long enough for a request already in flight on a rolling update; the pooler holds
      # server connections that a SIGKILL would leave for the database to time out.
      terminationGracePeriodSeconds: 30
      containers:
        - name: pgbouncer
          image: {{ $.Values.pgbouncer.image }}
          ports:
            - name: pgbouncer
              containerPort: 6432
          env:
            # The image listens on 5432 unless told otherwise, and a container that
            # listens somewhere the Service does not target is a pod that never becomes
            # ready. Named explicitly so the pair cannot drift.
            - name: LISTEN_PORT
              value: "6432"
            - name: DB_HOST
              value: {{ include "myota.postgresName" $ctx }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ $db.database }}
            - name: DB_USER
              value: {{ $.Values.postgres.appUser }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "myota.dbCredentialsSecret" $ctx }}
                  key: app-password
            # Clients authenticate with the same credentials the pooler uses upstream. A
            # per-client credential would need a userlist this chart cannot generate
            # without holding every service's password.
            - name: AUTH_TYPE
              value: plain
            - name: POOL_MODE
              value: {{ $.Values.pgbouncer.poolMode }}
            - name: DEFAULT_POOL_SIZE
              value: {{ $.Values.pgbouncer.defaultPoolSize | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ $.Values.pgbouncer.maxClientConn | quote }}
            # Prepared statements, tracked by the pooler.
            #
            # In transaction mode a server connection is handed to a different client
            # between transactions, so a statement one client prepared is invisible — or
            # worse, *visible under the same name* — to the next. sqlx names its
            # statements `sqlx_s_<n>`, so two replicas collide on `sqlx_s_1` and the
            # database answers `prepared statement "sqlx_s_1" already exists`. Setting a
            # cache capacity of zero does not help: it stops the client caching, and the
            # client still sends a named Parse on every query.
            #
            # PgBouncer 1.21+ implements prepared statements for transaction mode itself.
            # The number is per client connection and bounds memory; 200 covers every
            # statement this service has with room to spare.
            - name: MAX_PREPARED_STATEMENTS
              value: {{ $.Values.pgbouncer.maxPreparedStatements | quote }}
            # PgBouncer must tolerate parameters it does not understand being set by the
            # client driver at connect time, or every connection from a new driver
            # version fails with "unsupported startup parameter".
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits,options
          readinessProbe:
            # A TCP check rather than a query: the pooler answers only after its own
            # upstream connection is usable, and asking it to run SQL would test the
            # database a second time.
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.pgbouncer.resources | nindent 12 }}
{{- end }}
{{- end }}
