# The Myota test environment.
#
# One bundle, one chart, one values file. `values.yaml` here is the whole difference between
# this environment and production: the namespace, the hostnames and the switches.
#
# `helm.repo` is the chart published to GHCR by `.github/workflows/deploy.yml`, pinned by
# `helm.version`. The bundle carries no chart files: a copy inside the bundle is a second copy
# of the deployment definition that goes stale silently, and a packaged `.tgz` does not deploy
# at all — Fleet installs an empty release and reports `Ready` (F6, `deploy/fleet/README.md`).
#
# `repo` rather than `chart`, because Fleet deprecates an OCI URL in `helm.chart` and says so
# on every bundle build. `repo` takes the full OCI reference including the chart name;
# `helm push` is the opposite — it takes the repository and appends the name from Chart.yaml,
# which is what once produced a stray `charts/myota/myota` package.
#
# `tools/check_fleet_bundles.py` fails `make verify` when this version and the version in
# `deploy/myota/Chart.yaml` disagree, which is the only way they can drift apart.
#
# The database credentials are **not** here. They are SOPS-encrypted in
# `deploy/myota/secrets/` and applied by hand (ADR-0003): a GitRepo that can decrypt is a
# GitRepo that can leak. This bundle deploys everything that is safe to deploy from a commit.
defaultNamespace: myota-test

# A drift correction loop, on. The cluster converges to what is committed even when someone
# has edited a resource by hand — which is the point of deploying from Git rather than to it.
correctDrift:
  enabled: true

# Resources survive the bundle being removed. Combined with the Namespace's
# `helm.sh/resource-policy: keep`, an accidental `kubectl delete gitrepo` costs a reconcile,
# not a database.
keepResources: true

# No `targets` here. Fleet appends a fleet.yaml's targets to the GitRepo's, so declaring
# `clusterName: local` in both produced a bundle with two identical targets and no
# BundleDeployment — a silent non-deploy rather than an error. Targeting belongs in the
# GitRepo, which is the per-environment object; a bundle that also picked its own cluster
# would make the same decision in two places.

# No `clientSecretName`. This repository is public, so the clone needs no credential and the
# workspace holds no secret. A private repository would need `github-auth` copied into the
# workspace namespace, which is a credential moved between namespaces for no benefit here.

helm:
  repo: oci://ghcr.io/myota-platform/charts/myota
  version: 0.7.0
  releaseName: myota
  valuesFiles:
    - values.yaml
  # The migration Job is a `post-install,post-upgrade` hook and a database takes longer than
  # a stateless service to become ready. Fleet's default timeout would give up mid-migration.
  timeoutSeconds: 900
  # The namespace and its contents were created before this bundle existed (`kubectl apply`
  # during F5). Without this, Helm refuses to adopt resources it did not create.
  takeOwnership: true
  # Wait for the Deployments and StatefulSets, and for the migration Job to complete. A
  # bundle reported Ready while a migration is still running is a lie the next chunk would
  # build on.
  waitForJobs: true
