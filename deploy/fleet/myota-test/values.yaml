# Values for the `myota` chart in the test environment.
#
# Fleet passes this file to the shared chart at `deploy/myota`. It is the *only* difference
# between the two environments: the namespace, the hostnames and the switches. Anything a
# service would need to know about the environment beyond that comes from its ConfigMap, not
# from here.

namespace:
  # The bundle owns the namespace so the `keep` annotation exists from the first reconcile,
  # rather than depending on whoever ran `kubectl create namespace` remembering it.
  create: true
  name: myota-test

web:
  # The admin console is a real application as of A3: `images.admin-web` is the digest CI
  # published, and flipping `placeholder` is what deploys it. The Service name and port do
  # not change, so the IngressRoute and its certificate are untouched.
  #
  # The participant app is still the nginx placeholder that proves its hostname until P2
  # replaces it.
  apps:
    admin-web:
      placeholder: false
  ingress:
    enabled: true
    hosts:
      participant-web: myota-test.ea7klk.es
      admin-web: myota-admin-test.ea7klk.es

# The application services. `core` serves the administrator sign-in flow; the gateway
# routes `/v1/**` on both hosts to it and enforces the audience before a request reaches
# a service. Their images are the digests pinned below — CI wrote them, this file does
# not choose them.
services:
  core:
    enabled: true
    database:
      # The pooler, never `myota-core-postgres`: the NetworkPolicy is what enforces it
      # and the audit trail is what proves it.
      host: myota-core-pgbouncer
  gateway:
    enabled: true

# `/v1/**` on both hostnames, to the gateway. The front ends keep `/`.
api:
  enabled: true

# The databases, the poolers and the migration Job inherit `values.yaml`: the sizes there are
# already the test sizes, and repeating them here would be a second place to change.

# Image digests, written by CI. Do not edit by hand.
#
# Each entry is `ghcr.io/myota-platform/myota-new-<service>@sha256:<digest>`, committed by
# `.github/workflows/_image.yml` when a merge to main changes that service. A digest rather
# than a tag because a tag moves: `:main` is repointed by every merge, so a Deployment that
# referenced it could change without a commit and "what is running in test" would stop being
# answerable from the repository.
#
# The workload templates read `images.<service>`. Those templates arrive with each service's
# own chunk (A1 core, A7 geodata, P5 activity, A3 and P2 the front ends); until then a pin is
# recorded and pullable but deploys nothing, which is the honest state — the artefact exists,
# the workload does not.
#
# `tools/check_images.py` fails the build if any entry here is a tag instead of a digest,
# names the wrong image, or describes a service with no Dockerfile.
images:
  activity: ghcr.io/myota-platform/myota-new-activity@sha256:8b8f95d2597b84e91d25e9577f996e7722b31f1b9867042e83538fb3a6546ca0
  admin-web: ghcr.io/myota-platform/myota-new-admin-web@sha256:ec11ebf08c094f2699f31479a1a9b88127f3c1df4cce906954d957c119db3d0d
  core: ghcr.io/myota-platform/myota-new-core@sha256:5b1ac5136fadb0145330ba0d4430cfade2cfd5f9281a8764187f8aa7969e2b5c
  gateway: ghcr.io/myota-platform/myota-new-gateway@sha256:73b1bb26d97284a9e52e9f81fca8b03bdbc5aa182c19cd7951ce331bd58d09bf
  geodata: ghcr.io/myota-platform/myota-new-geodata@sha256:bde5cd4a1c4da2a18d5bbacf60cb3e7108356630c0d1d8860fc4cfbe20e842fc
