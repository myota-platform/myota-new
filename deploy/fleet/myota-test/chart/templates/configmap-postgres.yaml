{{- /*
The init script and, for geo, the extension.

Mounted at /docker-entrypoint-initdb.d, which the official image runs **only when the data
directory is empty**. That is what makes it safe to keep in the chart forever: on an
existing volume it does nothing, and on a fresh one it creates the role the pooler needs.
*/ -}}
{{- range $name, $db := .Values.databases }}
{{- $ctx := dict "root" $ "name" $name "database" $db.database }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.postgresName" $ctx }}-initdb
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "myota.labels" $ | nindent 4 }}
    myota.database: {{ $name }}
data:
  # Two roles. The superuser exists for the migration Job and for an operator; no service
  # authenticates as it, so a leaked application connection string cannot drop a database.
  10-app-role.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-SQL
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $.Values.postgres.appUser }}') THEN
                CREATE ROLE {{ $.Values.postgres.appUser }} LOGIN PASSWORD '${MYOTA_APP_PASSWORD}';
            END IF;
        END
        \$\$;
        GRANT ALL PRIVILEGES ON DATABASE {{ $db.database }} TO {{ $.Values.postgres.appUser }};
    SQL
    # Ownership of the schema, not just privileges on it: a service applies its own
    # migrations' leftovers and needs to create objects.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-SQL
        ALTER SCHEMA public OWNER TO {{ $.Values.postgres.appUser }};
        GRANT ALL ON SCHEMA public TO {{ $.Values.postgres.appUser }};
    SQL
{{- if eq $name "geo" }}
  # PostGIS is enabled at init rather than by the migration, because the migration's
  # `CREATE EXTENSION` needs superuser and the migration runs as the superuser anyway —
  # but doing it here means the extension is present before the first migration, so a
  # failure in the migration cannot leave a database that is neither plain nor spatial.
  20-postgis.sh: |
    #!/bin/bash
    set -euo pipefail
    # The application database.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-SQL
        CREATE EXTENSION IF NOT EXISTS postgis;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
    SQL
    # And the `postgres` maintenance database, because that is where `psql -U postgres`
    # lands when no `-d` is given — which is what the runbook's verification command does.
    # An operator asking "does this instance have PostGIS?" should not have to remember a
    # database name to get a truthful answer, and an instance whose whole purpose is
    # spatial data should answer yes from wherever you connect.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-SQL
        CREATE EXTENSION IF NOT EXISTS postgis;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
    SQL
{{- end }}
{{- end }}
