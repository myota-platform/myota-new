{{- /*
The database endpoint each service reads, as configuration.

Deliberately not a `DATABASE_URL` with the password in it. The repository's rule is that
the endpoint is configuration and the credential is a secret, and a URL is the one shape
that makes it easy to break that rule by accident — the password ends up in a ConfigMap, in
a `helm get values`, and in whatever logs configuration at startup.

The host is always the **pooler**. `tools/check_deploy.py` fails if any ConfigMap a workload
reads names a `-postgres` host, so a service cannot be pointed at the database directly
without a red build.
*/ -}}
{{- $root := . }}
{{- range $name, $db := .Values.databases }}
{{- $ctx := dict "root" $root "name" $name "database" $db.database }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.pgbouncerName" $ctx }}-endpoint
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "myota.labels" $root | nindent 4 }}
    myota.database: {{ $name }}
data:
  DATABASE_HOST: {{ include "myota.pgbouncerName" $ctx }}
  DATABASE_PORT: "6432"
  DATABASE_NAME: {{ $db.database }}
  DATABASE_USER: {{ $root.Values.postgres.appUser }}
  # Transaction pooling, stated here so a driver's session-level assumptions are visible
  # next to the endpoint rather than discovered as a bug: no advisory locks held across
  # requests, no `SET` that outlives a statement, no prepared statements outside a
  # transaction.
  DATABASE_POOL_MODE: {{ $root.Values.pgbouncer.poolMode }}
{{- end }}
