{{- /*
The migration Job.

Why a Job and not an init container or a replica that migrates at startup: a replica that
migrates means N replicas racing to apply the same DDL, and AGENTS.md rule 12 forbids it. A
Job runs once, takes a lock, and exits.

The **only** client in this chart that talks to PostgreSQL directly. Every service goes
through its pooler; migrations cannot, because the whole set is one transaction and
transaction pooling hands each statement to a different server connection — the advisory
lock would be released between statements. `tools/check_deploy.py` asserts that no
application-facing configuration names a `-postgres` host, so this exception stays the only
one.
*/ -}}
{{- if .Values.migrate.enabled }}
{{- $root := . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myota.labels" . | nindent 4 }}
  annotations:
    # Delete the previous Job on the next `helm upgrade` instead of leaving failed pods
    # behind. The Job's own pods are what an operator reads after a failure, so they are
    # kept for a short while rather than immediately.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  # A migration that has not finished in ten minutes is not slow, it is stuck. Failing
  # loudly beats holding the advisory lock until somebody notices.
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "myota.labels" . | nindent 8 }}
        # The NetworkPolicy allows only the pooler and these pods to reach PostgreSQL. The
        # label is the whole authorisation, so it is set here rather than inherited.
        myota.role: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      initContainers:
        {{- range $name, $db := .Values.databases }}
        {{- $ctx := dict "root" $root "name" $name }}
        - name: wait-for-{{ $name }}
          image: {{ $root.Values.migrate.image }}
          command:
            - sh
            - -c
            - |
              # Wait for the server, not for the Service: a headless Service has an
              # address as soon as the pod has one, which is before PostgreSQL is ready to
              # accept a connection.
              until pg_isready -h {{ include "myota.postgresName" $ctx }} -p 5432 -U {{ $root.Values.postgres.superuser }} -d {{ $db.database }}; do
                echo "waiting for {{ $name }}"
                sleep 2
              done
          resources:
            {{- toYaml $root.Values.migrate.resources | nindent 12 }}
        {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            {{- /*
            Migrations run as the **application role**, not the superuser.

            The first version used the superuser, and the result was a schema the services
            could not read: every table was owned by `postgres`, so `myota` had no
            privileges on it and `information_schema` showed none. Owning the objects it
            queries is the normal arrangement, and it removes a grant step that a later
            migration would have to remember to repeat.

            The superuser is left for the init scripts and for an operator running psql —
            the role no service authenticates as.
            */}}
            - name: PGUSER
              value: {{ .Values.postgres.appUser }}
            {{- /*
            One password per database, each from its own Secret. An earlier version read
            the *core* password for all three, so the Job migrated core and then failed to
            authenticate against geo and activity — a bug that looked like a credential
            problem and was a copy-paste.
            */}}
            {{- range $name, $db := .Values.databases }}
            {{- $ctx := dict "root" $root "name" $name }}
            - name: PGPASSWORD_{{ upper $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "myota.dbCredentialsSecret" $ctx }}
                  key: app-password
            {{- end }}
            - name: LOCK_TIMEOUT
              value: {{ .Values.migrate.lockTimeout | quote }}
            - name: RELEASE
              value: {{ .Release.Name }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            {{- range $name, $db := .Values.databases }}
            {{- $ctx := dict "root" $root "name" $name }}
            - name: {{ $name }}-sql
              mountPath: /sql/{{ $name }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-migrate-script
            defaultMode: 0555
        {{- range $name, $db := .Values.databases }}
        {{- $ctx := dict "root" $root "name" $name }}
        - name: {{ $name }}-sql
          configMap:
            name: {{ include "myota.postgresName" $ctx }}-migrations
        {{- end }}
{{- end }}
